name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secretos:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Se usa el binario de gitleaks y no la acción oficial: la acción exige una
      # licencia de pago cuando el repositorio pertenece a una organización, y la
      # herramienta en sí es libre. Ver docs/SEGURIDAD.md §2.1.
      - name: Instalar gitleaks
        run: |
          TAG=$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name)
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${TAG}/gitleaks_${TAG#v}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Revisar el historial completo
        run: gitleaks detect --source . --redact --no-banner --verbose

  verificacion:
    name: Tipos, lint y pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexo_owner
          POSTGRES_PASSWORD: nexo_ci
          POSTGRES_DB: nexo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexo_owner -d nexo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT_URL: postgresql://nexo_owner:nexo_ci@localhost:5432/nexo?schema=public
      DATABASE_URL: postgresql://nexo_app:nexo_ci_app@localhost:5432/nexo?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # El postinstall de @nexo/api corre `prisma generate`, así que el cliente
      # queda disponible para la verificación de tipos.
      - run: pnpm install --frozen-lockfile

      # El rol de aplicación se crea antes de migrar: las políticas de RLS de la
      # migración le otorgan permisos y necesitan que ya exista.
      - name: Crear rol de aplicación
        run: |
          PGPASSWORD=nexo_ci psql -h localhost -U nexo_owner -d nexo -c \
            "CREATE ROLE nexo_app WITH LOGIN PASSWORD 'nexo_ci_app' NOBYPASSRLS NOSUPERUSER;
             GRANT CONNECT ON DATABASE nexo TO nexo_app;"

      - name: Aplicar migraciones
        run: |
          if [ -d apps/api/prisma/migrations ]; then
            pnpm --filter @nexo/api exec prisma migrate deploy
          else
            echo "Todavía no hay migraciones que aplicar."
          fi

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  dependencias:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
