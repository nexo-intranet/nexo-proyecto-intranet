name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secretos:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verificacion:
    name: Tipos, lint y pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexo_owner
          POSTGRES_PASSWORD: nexo_ci
          POSTGRES_DB: nexo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexo_owner -d nexo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT_URL: postgresql://nexo_owner:nexo_ci@localhost:5432/nexo?schema=public
      DATABASE_URL: postgresql://nexo_app:nexo_ci_app@localhost:5432/nexo?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # El rol de aplicación se crea antes de migrar: las políticas RLS de la
      # migración le otorgan permisos y necesitan que ya exista.
      - name: Crear rol de aplicación
        run: |
          PGPASSWORD=nexo_ci psql -h localhost -U nexo_owner -d nexo -c \
            "CREATE ROLE nexo_app WITH LOGIN PASSWORD 'nexo_ci_app' NOBYPASSRLS NOSUPERUSER;
             GRANT CONNECT ON DATABASE nexo TO nexo_app;"

      - run: pnpm --filter @nexo/api exec prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  dependencias:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
